name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Kundan-Enterprise-ERP.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kundan-Enterprise-ERP-APK
          path: Kundan-Enterprise-ERP.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          tag_name: v1.0-apk
          name: "Kundan Enterprise Android App (APK)"
          body: |
            ### 📱 Kundan Enterprise ERP Android App
            
            Download the latest APK directly to your Android phone:
            1. Download `Kundan-Enterprise-ERP.apk` below.
            2. Tap on the downloaded file and select **Install**.
            3. Open **Kundan Enterprise** on your phone!
          files: Kundan-Enterprise-ERP.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
